<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Saad Sinan — Flutter Developer &amp; Software Engineer</title>
    <meta
      name="description"
      content="Saad Sinan — Flutter developer and software engineering student in Damascus. Cross-platform mobile apps built with Flutter, Dart, Firebase and clean, scalable architecture."
    />
    <meta name="author" content="Saad Sinan" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Saad Sinan — Flutter Developer" />
    <meta
      property="og:description"
      content="Cross-platform mobile apps built with Flutter, Dart and clean, scalable architecture."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;500;600;700&display=swap"
    />

    <!-- Applied before paint so the first frame is already in the right theme. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');

          var lang = localStorage.getItem('portfolio-lang') || 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          /* storage unavailable — fall back to markup defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
