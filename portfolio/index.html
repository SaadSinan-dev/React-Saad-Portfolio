    <meta
      property="og:description"
      content="React web products, Flutter applications, and backend-integrated systems. Explore the work of software engineering student Saad Sinan."

    <meta property="og:image" content="https://saad-dev-portfolio.netlify.app/profile.png" />

    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;500;600;700&display=swap"
    />

    <!-- Applied before paint so the first frame is already in the right theme. -->
    <script>
      (function () {
        var dark = false;
        var lang = 'en';
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var savedLang = localStorage.getItem('portfolio-lang');
          dark = saved === 'dark';
          lang = savedLang === 'ar' ? 'ar' : 'en';
        } catch (e) {
          /* storage unavailable — fall back to markup defaults */
        }
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d0e10' : '#f8f8f6');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
